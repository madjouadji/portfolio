{% extends "base.html" %}
{% block content %}
{% set t = ui.enseignement %}
<section class="page-head"><div class="wrap"><p class="kicker">{{ t.kicker }}</p><h1>{{ t.h1 }}</h1><p class="sub">{{ t.sous_titre }}</p></div></section>
<section class="section"><div class="wrap">
  <ul class="courses">
    {% for c in auxiliariats %}
    <li><span class="code">{{ c.code }}</span><span class="ctitle">{{ c.titre }}</span><span class="term">{{ c.session }}</span></li>
    {% endfor %}
  </ul>
  <p class="note">{{ t.note }}</p>
</div></section>
{% endblock %}
