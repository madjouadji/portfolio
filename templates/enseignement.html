{% extends "base.html" %}
{% block content %}
{% set t = ui.enseignement %}
    <h1>{{ t.titre }}</h1>

    <h2>{{ ui.auxiliariats }}</h2>
    <p class="sub">{{ t.sous_titre }}</p>
    {% for c in auxiliariats %}
    <div class="row"><div class="y">{{ c.session }}</div><div class="what"><b><span class="code">{{ c.code }}</span>{{ c.titre }}</b></div></div>
    {% endfor %}

    <h2>{{ ui.secondaire }}</h2>
    <div class="row"><div class="y">2019–2022</div><div class="what"><b>Togo</b>{{ enseignement_secondaire }}</div></div>
{% endblock %}
