{% extends "base.html" %}
{% block content %}
{% set t = ui.exposes %}
<section class="page-head"><div class="wrap"><p class="kicker">{{ t.kicker }}</p><h1>{{ t.h1 }}</h1></div></section>
<section class="section"><div class="wrap">
  <ol class="xlist">
    {% for e in exposes %}
    <li>
      <span class="xn">{{ loop.index }}</span>
      <span class="xb"><strong>{% if e.url %}<a href="{{ e.url }}" target="_blank" rel="noopener">{{ e.titre }} ↗</a>{% else %}{{ e.titre }}{% endif %}</strong><span class="list-meta">{{ e.contexte }}</span></span>
      <span class="xd">{{ e.date }}</span>
    </li>
    {% endfor %}
  </ol>
</div></section>
{% endblock %}
