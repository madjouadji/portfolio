{% extends "base.html" %}
{% block content %}
{% set t = ui.exposes %}
    <h1>{{ t.h1 }}</h1>
    {% for e in exposes %}
    <div class="row"><div class="y">{{ e.date }}</div><div class="what"><b>{% if e.url %}<a href="{{ e.url }}" target="_blank" rel="noopener">{{ e.titre }} <span aria-hidden="true">↗</span></a>{% else %}{{ e.titre }}{% endif %}</b>{{ e.contexte }}</div></div>
    {% endfor %}
{% endblock %}
